name: CI

on:
  pull_request:
    paths:
      - "etl/**"
  push:
    branches: [main]
    paths:
      - "etl/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            etl/requirements.txt
            etl/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r etl/requirements.txt -r etl/requirements-dev.txt

      - name: Tests + cobertura (100% requerido)
        run: cd etl && python -m pytest --cov=src --cov-report=term-missing
