name: CI

on:
  pull_request:
    paths:
      - "etl/**"
      - "site/**"
  push:
    branches: [main]
    paths:
      - "etl/**"
      - "site/**"

jobs:
  test-etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            etl/requirements.txt
            etl/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r etl/requirements.txt -r etl/requirements-dev.txt

      - name: Tests + cobertura (100% requerido)
        run: cd etl && python -m pytest --cov=src --cov-report=term-missing

  test-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Instalar dependencias
        working-directory: site
        run: npm ci

      - name: Tests + cobertura (100% requerido)
        working-directory: site
        run: npm run test:coverage
